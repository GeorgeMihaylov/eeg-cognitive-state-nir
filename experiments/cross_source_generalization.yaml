experiment:
  name: "cross_source_generalization_label_q5"
  output_dir: "./benchmark_results/cross_source_generalization"
  reports_dir: "./reports"

dataset:
  name: "emotiv_cognitive"
  data_path: "./data/processed/windowed_eeg_pm_dataset_w10.parquet"
  logical_recording_map_path: "./data/interim/logical_recording_map.parquet"
  feature_set: "pow_plus_eeg"
  target: "label_q5"
  subject_col: "subject_id"
  task: "cognitive_load_5class"
  n_classes: 5
  max_features: 448

sequence:
  length: 8
  stride: 1
  target_position: "last"
  expected_step_seconds: 10.0
  max_gap_seconds: 10.5

validation_by_subject_mode:
  source_exclusive:
    strategy: "group_record"
    group_column: "subject_id"
    validation_size: 0.15
  shared_subject:
    strategy: "group_record"
    group_column: "record_group_id"
    validation_size: 0.15

models:
  random_forest:
    type: "random_forest"
    task_type: "classification"
    params:
      n_estimators: 50
      max_depth: 12
      n_jobs: -1
      random_state: 42

  torch_transformer:
    type: "torch_transformer"
    task_type: "classification"
    params:
      sequence_length: 8
      d_model: 128
      nhead: 4
      num_layers: 2
      dim_feedforward: 256
      dropout: 0.1
      activation: "gelu"
      pooling: "last"
      positional_encoding: "learned"
      batch_size: 128
      max_epochs: 15
      learning_rate: 0.001
      weight_decay: 0.0001
      validation_size: 0.15
      early_stopping_patience: 4
      device: "auto"
      random_state: 42
      standardize: true
      num_workers: 0

evaluation:
  protocol: "cross_source_holdout"
  remove_logical_duplicates: true
  random_state: 42
  thresholds:
    minimum_train_subjects: 5
    minimum_test_subjects: 3
    minimum_train_classes: 5
    minimum_test_classes: 2
    minimum_predictions_per_test_subject: 20

matrix:
  directions:
    - "gpn_data->Old_EEG"
    - "Old_EEG->gpn_data"
  subject_modes:
    - "source_exclusive"
    - "shared_subject"
  models:
    - "random_forest"
    - "torch_transformer"

runtime_estimates_seconds:
  random_forest: 30
  torch_transformer: 180

in_domain_references:
  gpn_data:
    config: "./configs/groupkfold_source_gpn_rf_transformer_label_q5.yaml"
  Old_EEG:
    config: "./configs/groupkfold_source_old_eeg_rf_transformer_label_q5.yaml"
