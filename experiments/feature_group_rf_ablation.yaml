experiment:
  name: feature_group_rf_ablation
  output_dir: benchmark_results/feature_group_rf_ablation
  report_path: reports/feature_group_rf_ablation.md
  summary_path: reports/feature_group_rf_summary.json
  canonical_reference_predictions: benchmark_results/groupkfold_rf_label_q5/20260713_182031/emotiv_cognitive/cognitive_load_5class/random_forest/group_kfold_subject/predictions.parquet

dataset:
  name: emotiv_cognitive
  data_path: data/processed/windowed_eeg_pm_dataset_w10.parquet
  subject_col: subject_id
  expected_supervised_rows: 45384

feature_groups:
  eeg_only:
    feature_set: eeg_only
    feature_count: 168
    feature_list_sha256: 6e822ee172422e7138945b47b2b27c947393b828b72d96b7a8e22850aded8aca
  pow_only:
    feature_set: pow_only
    feature_count: 280
    feature_list_sha256: c3106631e4ad3eff1694c874a9ff5c4e26470aa587c7294cc5c3047c53d832dd
  eeg_pow:
    feature_set: eeg_pow
    feature_count: 448
    feature_list_sha256: 8cd5d70faa8ff30fb4290dd9d9a2dde0e81f50e7682d05668b5fb47df511fd51

tasks:
  classification:
    target: label_q5
    benchmark_task: cognitive_load_5class
    model: random_forest_classifier
    n_classes: 5
  regression:
    target: target_focus
    benchmark_task: focus_regression
    model: random_forest_regressor

models:
  random_forest_classifier:
    type: random_forest
    task_type: classification
    params:
      n_estimators: 50
      max_depth: 12
      random_state: 42
      n_jobs: -1
  random_forest_regressor:
    type: random_forest
    task_type: regression
    params:
      n_estimators: 50
      max_depth: 12
      random_state: 42
      n_jobs: -1

evaluation:
  protocol: group_kfold_subject
  n_splits: 5
  group_column: subject_id
  random_state: 42

analysis:
  bootstrap_samples: 10000
  random_state: 42
  global_label_thresholds: [0.330177, 0.387786, 0.444458, 0.526585]
