model:
  name: torch_transformer
  type: torch_transformer
  params:
    sequence_length: 8
    d_model: 128
    nhead: 4
    num_layers: 2
    dim_feedforward: 256
    dropout: 0.1
    activation: gelu
    pooling: last
    positional_encoding: learned
    num_classes: 5
    batch_size: 128
    max_epochs: 15
    learning_rate: 0.001
    weight_decay: 0.0001
    validation_size: 0.15
    early_stopping_patience: 4
    device: auto
    random_state: 42
    standardize: true
    num_workers: 0

sequence:
  length: 8
  stride: 1
  target_position: last
  expected_step_seconds: 10.0
  max_gap_seconds: 10.5

validation:
  strategy: group_record
  group_column: record_group_id
  validation_size: 0.15
  random_state: 42

evaluation:
  protocol: group_kfold_subject
  n_splits: 5
  group_column: subject_id
  folds:
    - 1
    - 2
    - 3
    - 4
    - 5
  random_state: 42

protocol:
  outer_folds:
