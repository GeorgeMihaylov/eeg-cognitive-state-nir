experiment:
  name: preprocessing_ablation_shallowconvnet
  objective_metric: balanced_accuracy
  objective_direction: maximize
  output_dir: benchmark_results/preprocessing_ablation_shallowconvnet

cache:
  cache_dir: data/interim/raw_eeg_cache_w10_v3
  index_dir: data/interim/preprocessing_ablation_manifests
  processed_path: data/processed/windowed_eeg_pm_dataset_w10.parquet
  catalog_path: data/interim/emotiv_record_catalog.csv
  audit_schema_path: data/interim/raw_eeg_schema.json
  candidate_index_paths:
    - data/interim/raw_eeg_window_index_w10_raw_v3.parquet
    - data/interim/raw_eeg_window_index_w10_bp_notch_car_v3.parquet
  loader_schema_version: raw-eeg-window-v3
  channel_order:
    - EEG.AF3
    - EEG.F7
    - EEG.F3
    - EEG.FC5
    - EEG.T7
    - EEG.P7
    - EEG.O1
    - EEG.O2
    - EEG.P8
    - EEG.T8
    - EEG.FC6
    - EEG.F4
    - EEG.F8
    - EEG.AF4
  max_missing_fraction: 0.02
  estimated_cache_size_bytes: 6511440533
  minimum_free_reserve_bytes: 21474836480

dataset:
  name: emotiv_raw_eeg
  task: cognitive_load_5class
  mode: raw_deduplicated_logical_records
  target: label_q5
  classes: 5
  logical_recording_map_path: data/interim/logical_recording_map.parquet

preprocessing:
  schema_version: preprocessing-spec-v1
  target_sampling_rate: 256
  padding_seconds: 2
  window_seconds: 10
  output_dtype: float32
  bandpass:
    enabled: false
    low_hz: 1.0
    high_hz: 45.0
    order: 4
  notch:
    enabled: false
    frequency_hz: 50.0
    q: 30.0
  car:
    enabled: false

model:
  name: torch_shallow_convnet
  params:
    n_filters: 40
    temporal_kernel_samples: 25
    pool_size: 75
    pool_stride: 15
    dropout: 0.5
    batch_size: 128
    max_epochs: 15
    learning_rate: 0.001
    weight_decay: 0.0001
    validation_size: 0.15
    early_stopping_patience: 4
    device: auto
    random_state: 42
    standardize: true
    num_workers: 0

validation:
  strategy: group_record
  group_column: record_group_id
  validation_size: 0.15
  random_state: 42

evaluation:
  protocol: group_kfold_subject
  n_splits: 5
  group_column: subject_id
  precomputed_fold_column: outer_fold
  random_state: 42

search_space:
  preprocessing.bandpass.enabled:
    values: [false, true]
  preprocessing.notch.enabled:
    values: [false, true]
  preprocessing.car.enabled:
    values: [false, true]
