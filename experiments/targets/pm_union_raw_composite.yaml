schema_version: raw-eeg-pm-union-composite-config-v1
mode: pm_union_composite

processed_path: data/processed/windowed_eeg_pm_dataset_w10.parquet
catalog_path: data/interim/emotiv_record_catalog.csv
audit_schema_path: data/interim/raw_eeg_schema.json
historical_manifest_path: data/interim/raw_eeg_window_index_w10_raw_v3.parquet
historical_cache_root: data/interim/raw_eeg_cache_w10_v3
logical_recording_map_path: data/interim/logical_recording_map.parquet

delta_cache_root: data/interim/raw_eeg_cache_w10_pm_union_delta_v1
output_manifest_path: data/interim/raw_eeg_window_index_w10_pm_union_composite_v1.parquet
output_summary_path: data/interim/raw_eeg_window_index_w10_pm_union_composite_v1_stats.json

target_sfreq: 256.0
max_missing_fraction: 0.02

raw_preprocessing:
  resample_hz: 256.0
  bandpass:
    enabled: false
    low_hz: 1.0
    high_hz: 45.0
  notch:
    enabled: false
    frequency_hz: 50.0
    quality_factor: 30.0
  rereference:
    mode: none
  artifact_rejection:
    enabled: false
    max_abs_amplitude: null
    max_flat_fraction: null
