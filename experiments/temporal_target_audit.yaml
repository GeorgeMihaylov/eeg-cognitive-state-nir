audit:
  name: temporal_target_audit
  data_path: data/processed/windowed_eeg_pm_dataset_w10.parquet
  output_dir: benchmark_results/label_feature_audit
  temporal_report: reports/temporal_label_structure.md
  diagnostic_report: reports/diagnostic_baselines.md
  summary_path: reports/temporal_target_summary.json

  target_column: target_focus
  label_column: label_q5
  n_classes: 5
  expected_supervised_rows: 45384
  lags: [1, 2, 3, 5, 10, 20]

  # Exact identity/fold/target reference from the canonical seed-42 RF run.
  canonical_reference_predictions: >-
    benchmark_results/groupkfold_rf_label_q5/20260713_182031/emotiv_cognitive/cognitive_load_5class/random_forest/group_kfold_subject/predictions.parquet

blocked_time:
  early_end: 0.4
  late_start: 0.6

diagnostic_baselines:
  n_splits: 5
  random_state: 42

  logistic_regression:
    max_iter: 500
    solver: lbfgs

  random_forest:
    n_estimators: 50
    max_depth: 6
    min_samples_leaf: 10
    n_jobs: -1
