experiment:
  type: user_calibration
  name: label_q5_finetuning_cuda_integration_smoke
  output_dir: ./benchmark_results/calibration_label_q5_cuda_smoke/personalization
  report_dir: ./benchmark_results/calibration_label_q5_cuda_smoke/report_runtime
  seed: 42
  resume: true
  require_cuda: true
  bootstrap_samples: 100

base_run:
  config_path: ./experiments/calibration/label_q5_finetuning_cuda_smoke_base.yaml
  train_if_missing: true
  dataset: emotiv_cognitive
  task: cognitive_load_5class
  model: torch_mlp

calibration:
  target_subjects: [0110f12e, 8191f1d9]
  budgets_fraction: [0, 0.05, 0.20]
  methods: [zero_shot, head_only, full_model]
  window_seconds: 10
  max_gap_seconds: 10.5

  defaults:
    split_strategy: chronological_prefix
    fraction_allocation: global_prefix
    purge_windows: 0
    max_epochs: 2
    learning_rate: 0.001
    weight_decay: 0.0001
    early_stopping_patience: 2
    calibration_validation_fraction: 0.2
    fallback_fixed_epochs: 2
    min_calibration_sequences: 1
    min_evaluation_sequences: 20
    minimum_calibration_samples: 5
    minimum_evaluation_samples: 20
    minimum_adaptation_train_samples: 2
    minimum_adaptation_validation_samples: 1
    minimum_final_evaluation_samples: 20
    random_state: 42

  method_params:
    head_only:
      learning_rate: 0.001
    full_model:
      learning_rate: 0.0001
