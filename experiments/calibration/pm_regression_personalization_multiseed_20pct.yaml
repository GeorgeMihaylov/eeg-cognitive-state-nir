experiment:
  name: pm_regression_personalization_multiseed_20pct
  type: pm_regression_personalization_multiseed
  output_dir: ./benchmark_results/pm_regression_personalization_multiseed_20pct
  split_seed: 42
  model_seeds: [7, 42, 2026]
  require_cuda: true
  resume: true
  seed_42_source_root: ./benchmark_results/pm_regression_personalization_20pct

base_template:
  config_path: ./experiments/calibration/pm_regression_personalization_20pct_base.yaml
  dataset: emotiv_pm_regression
  model: torch_mlp

targets:
  - target_attention
  - target_engagement
  - target_excitement
  - target_stress
  - target_relaxation
  - target_interest
  - target_focus

calibration:
  maximum_calibration_fraction: 0.20
  budgets: [0.20]
  methods:
    - zero_shot
    - head_only
    - full_model
  adaptation_validation_fraction: 0.20
  fraction_allocation: global_prefix
  window_seconds: 10.0
  max_gap_seconds: 10.5
  minimum_calibration_samples: 5
  minimum_adaptation_train_samples: 4
  minimum_evaluation_samples: 20
  method_params:
    head_only:
      max_epochs: 5
      learning_rate: 0.001
      weight_decay: 0.0001
      early_stopping_patience: 3
    full_model:
      max_epochs: 5
      learning_rate: 0.0001
      weight_decay: 0.0001
      early_stopping_patience: 3

statistics:
  bootstrap_samples: 1000
  bootstrap_seed: 42
