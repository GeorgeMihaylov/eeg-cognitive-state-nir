output_dir: ./benchmark_results/calibration_label_q5_multiseed_20pct/template_base

datasets:
  emotiv_cognitive:
    data_path: ./data/processed/windowed_eeg_pm_dataset_w10.parquet
    feature_set: pow_plus_eeg
    target_col: label_q5
    subject_col: subject_id
    n_classes: 5
    discretize: false
    max_features: 448
    expected_feature_count: 448

tasks:
  - cognitive_load_5class

validation:
  strategy: group_holdout
  group_column: subject_id
  fraction: 0.15
  random_state: 42

models:
  torch_mlp:
    type: torch_mlp
    task_type: classification
    feature_scaling:
      strategy: standard_clip
      clip_percentiles: [0.5, 99.5]
      scale_floor: 1.0e-8
    params:
      hidden_dims: [256, 128]
      dropout: 0.3
      activation: relu
      batch_size: 256
      max_epochs: 8
      learning_rate: 0.001
      weight_decay: 0.0001
      validation_size: 0.15
      early_stopping_patience: 3
      device: cuda
      random_state: 42
      standardize: false

evaluation:
  protocol: group_kfold_subject
  n_splits: 5
  group_column: subject_id
  random_state: 42

task_config:
  random_state: 42

run_within_subject: false
run_loso: false
