experiment:
  type: user_calibration
  output_dir: ./benchmark_results/calibration_label_q5_smoke/personalization
  report_dir: ./benchmark_results/calibration_label_q5_smoke/report_runtime

base_run:
  config_path: ./experiments/calibration/label_q5_finetuning_base_smoke.yaml
  train_if_missing: true
  dataset: emotiv_cognitive
  task: cognitive_load_5class
  model: torch_mlp

calibration:
  target_subjects:
    - 8191f1d9
  budgets_fraction: [0, 0.01, 0.05, 0.10, 0.20]
  methods:
    - no_adaptation
    - head_only_finetuning
    - full_finetuning
  window_seconds: 10
  max_gap_seconds: 10.5

  defaults:
    split_strategy: chronological_prefix
    purge_windows: 0
    max_epochs: 3
    learning_rate: 0.001
    weight_decay: 0.0001
    early_stopping_patience: 2
    calibration_validation_fraction: 0.2
    fallback_fixed_epochs: 3
    min_calibration_sequences: 1
    min_evaluation_sequences: 20
    minimum_calibration_samples: 5
    minimum_evaluation_samples: 20
    random_state: 42

  method_params:
    head_only_finetuning:
      learning_rate: 0.001
    full_finetuning:
      learning_rate: 0.0001
