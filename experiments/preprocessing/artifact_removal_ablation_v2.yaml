experiment_id: artifact_removal_ablation_v2
result_status: baseline

dataset:
  raw_window_index: data/interim/raw_eeg_window_index_w10_raw_v3.parquet
  target_table: data/processed/windowed_eeg_pm_dataset_w10.parquet
  logical_recording_map: data/interim/logical_recording_map.parquet
  reference_fold_manifest: benchmark_results/pm_all_targets_feature_baseline_v1/preregistration/fold_manifest.json
  raw_preprocessing:
    resample_hz: 256
    bandpass: {enabled: false, low_hz: 1.0, high_hz: 45.0}
    notch: {enabled: false, frequency_hz: 50.0, quality_factor: 30.0}
    rereference: {mode: none}
    artifact_rejection: {enabled: false, max_abs_amplitude: null, max_flat_fraction: null}
  expected_counts:
    signal_windows: 30958
    attention: 29569
    engagement: 30958
    excitement: 30958
    stress: 30958
    relaxation: 30958
    interest: 30958
    focus: 30958

targets: [attention, engagement, excitement, stress, relaxation, interest, focus]
variants: [raw, ica_record_local, faster_online, faster_full_record_local]
task_types: [classification, regression]

preprocessing:
  variants: [raw, ica_record_local, faster_online, faster_full_record_local]
  sample_rate_hz: 256
  z_threshold: 3.0
  interpolation_method: mean
  average_reference: false
  ica:
    n_components: null
    max_iter: 1000
    random_state: 42
  full_faster:
    max_iter: 1
    run_ica: true
    ica_n_components: null
    ica_max_iter: 1000
    ica_random_state: 42

model:
  name: torch_shallow_convnet
  params:
    n_filters: 40
    temporal_kernel_samples: 25
    pool_size: 75
    pool_stride: 15
    dropout: 0.5
    batch_size: 128
    max_epochs: 15
    learning_rate: 0.001
    weight_decay: 0.0001
    validation_size: 0.15
    early_stopping_patience: 4
    device: auto
    random_state: 42
    standardize: true
    num_workers: 0

evaluation:
  protocol: fixed_group_kfold_subject
  folds: [1, 2, 3, 4, 5]
  group_column: subject_id
  inner_validation_group_column: record_group_id

smoke:
  targets: [attention, engagement, excitement, stress, relaxation, interest, focus]
  variants: [raw, ica_record_local, faster_online, faster_full_record_local]
  task_types: [classification, regression]
  folds: [1]
  max_train_windows: 96
  max_test_windows: 48
  max_epochs: 1
  batch_size: 64

output_dir: benchmark_results/artifact_removal_ablation_v2


