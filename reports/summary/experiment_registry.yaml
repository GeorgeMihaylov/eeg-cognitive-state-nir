  - experiment_id: label_q5_personalization_multiseed_20pct
    title: Трёхсидовая персонализация label_q5
    category: personalization
    status: final
    task: cognitive_load_5class
    target: label_q5
    model: torch_mlp
    feature_set: pow_plus_eeg
    preprocessing: standard_clip
    evaluation_protocol: 5-fold GroupKFold plus chronological user calibration
    seeds: [7, 42, 2026]
    n_subjects: 53
    primary_metric:
      name: macro_f1_gain
      direction: higher_is_better
      value_source: &classification_personalization_gain
        type: csv_filter
        path: benchmark_results/calibration_label_q5_multiseed_20pct/20260725_172240/multiseed_aggregate.csv
        filters:
          method: full_model
          metric: macro_f1
        column: mean_gain
        aggregation: first
        optional_runtime: true
    secondary_metrics:
      - name: accuracy_gain
        direction: higher_is_better
        value_source:
          type: csv_filter
          path: benchmark_results/calibration_label_q5_multiseed_20pct/20260725_172240/multiseed_aggregate.csv
          filters:
            method: full_model
            metric: accuracy
          column: mean_gain
          aggregation: first
          optional_runtime: true
      - name: balanced_accuracy_gain
        direction: higher_is_better
        value_source:
          type: csv_filter
          path: benchmark_results/calibration_label_q5_multiseed_20pct/20260725_172240/multiseed_aggregate.csv
          filters:
            method: full_model
            metric: balanced_accuracy
          column: mean_gain
          aggregation: first
          optional_runtime: true
    personalization:
      method: full_model
