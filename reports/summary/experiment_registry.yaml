      source: cli.py --experiment-matrix experiments/preprocessing_ablation_shallowconvnet.yaml --seed
      primary_config_seed: 42
      external_seeds: [7, 123]
      representative_runs:
        7: benchmark_results/preprocessing_ablation_shallowconvnet/runs/14c967f7ff382bc0e87e/20260716_152802/run_manifest.json
        42: benchmark_results/preprocessing_ablation_shallowconvnet/full/trial_A/seed_42/20260716_131347
