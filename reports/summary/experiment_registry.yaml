    report_path: reports/preprocessing_selected_trials_multiseed.md
    runtime_path: benchmark_results/preprocessing_ablation_shallowconvnet
    config_path: experiments/preprocessing_ablation_shallowconvnet.yaml
    commit: 63dda2c
    result_summary: Band-pass и notch дали малые нестабильные BA-изменения; CAR ухудшал seed-42 contrasts, значимость не заявлялась.
    limitations:
      - Полный A–H factorial выполнен только для seed 42.
    tags: [diagnostic, raw_eeg, preprocessing, multiseed]

