schema_version: 1

experiments:
  - experiment_id: label_q5_random_forest_groupkfold
    title: Random Forest baseline для label_q5
    category: model
    status: baseline
    task: cognitive_load_5class
    target: label_q5
    model: random_forest
    feature_set: pow_plus_eeg
    preprocessing: none
    evaluation_protocol: 5-fold GroupKFold by subject_id
    seeds: [42]
    n_subjects: 54
    primary_metric:
      name: macro_f1
      direction: higher_is_better
      value_source:
        type: csv_filter
        path: benchmark_results/groupkfold_rf_label_q5/summary_20260713_182031.csv
        filters:
          model: random_forest
        column: macro_f1_mean
        aggregation: first
        optional_runtime: true
    secondary_metrics:
      - name: balanced_accuracy
        direction: higher_is_better
        value_source:
          type: csv_filter
          path: benchmark_results/groupkfold_rf_label_q5/summary_20260713_182031.csv
          filters:
            model: random_forest
          column: balanced_accuracy_mean
          aggregation: first
          optional_runtime: true
      - name: accuracy
        direction: higher_is_better
        value_source:
          type: csv_filter
          path: benchmark_results/groupkfold_rf_label_q5/summary_20260713_182031.csv
          filters:
            model: random_forest
          column: accuracy_mean
          aggregation: first
          optional_runtime: true
    report_path: reports/transformer_benchmark_report.md
    runtime_path: benchmark_results/groupkfold_rf_label_q5
    config_path: configs/groupkfold_rf_label_q5.yaml
    commit: e87fa46
    result_summary: Оконный классический baseline с macro F1 0.2955.
    limitations:
      - Не моделирует временной контекст между окнами.
    tags: [classification, feature_window, classical_ml]

