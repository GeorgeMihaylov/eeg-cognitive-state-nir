        level: primary
      - type: report
        path: reports/integration/wesad_metrics_review.md
        supports: Проверку loader/task на integration branch.
        level: supporting
      - type: commit
        commit: bf0aa97
        supports: Исторические отдельные WESAD experiments вне текущего benchmark contract.
        level: historical
    gaps:
      - Нет текущего канонического WESAD experiment config и записи experiment registry.
      - Исторические WESAD scripts не являются текущим integrated pipeline.
    minimum_closure_action:
      action_type: research_decision
      description: >
        Уточнить, обязателен ли WESAD deliverable; при положительном решении
        интегрировать один ограниченный baseline через текущий runner.
      estimated_scope: medium
    new_experiment_required: false
    closure_priority: P2
    blocking_dependencies: [официальный scope внешних данных]
    completion_criterion: Scope-решение принято; при включении есть config, test и baseline.
    notes:
      - Исторический результат не переносится автоматически.

