schema_version: 1

project:
  name: eeg-cognitive-state-nir
  requirements_source_status: project_plan_only
  primary_source:
    path: README.md
    type: project_plan
  source_warnings:
    - Официальный файл технического задания не найден в tracked-дереве или Git history.
    - README фиксирует цели проекта, но не задаёт формальную обязательность и приоритет всех deliverables.
    - AGENTS.md и PROJECT_CONTEXT.md используются только как внутренние планы, а не как официальный текст ТЗ.
  missing_authoritative_source:
    description: >
      Для окончательной юридической и приёмочной трассировки требуется добавить
      официальный документ ТЗ или утверждённый план работ с критериями приёмки.
    expected_kind: technical_specification_or_approved_work_plan

requirements:
  - requirement_id: R-DATA
    parent_id: null
    title: Internal canonical data and external task contracts
    domain: data
    requirement_kind: parent_requirement
    source:
      type: project_plan
      path: README.md
      section: Назначение проекта / Данные
      quote: поддержать несколько представлений данных
    normalized_requirement: Internal canonical data and external task contracts. Current scope as of 2026-11-06; historical
      numerical evidence retains its original protocol.
    requirement_type: data
    priority: important
    coverage:
      implementation: complete
      reproducible_config: partial
      experimental_validation: complete
      result_quality: complete
      documentation: partial
      integration: complete
      demonstration: not_applicable
    overall_status: partial
    evidence:
    - type: code
      path: bench/datasets/emotiv_loader.py
      supports: Унифицированную загрузку EEG/POW и целей.
      level: primary
    - type: report
      path: reports/logical_recording_audit.md
      supports: Аудит записей и межисточниковых дубликатов.
      level: primary
    - type: report
      path: PROJECT_CONTEXT.md
      supports: Internal canonical data and external task contracts
      level: primary
    gaps:
    - A unified publication data card spanning current internal and external tracks remains to be consolidated.
    minimum_closure_action:
      action_type: documentation
      description: Consolidate provenance, deduplication, native external labels and support; no data/cache rebuild.
      estimated_scope: small
    new_experiment_required: false
    closure_priority: P1
    blocking_dependencies: []
    completion_criterion: Consolidate provenance, deduplication, native external labels and support; no data/cache
      rebuild.
    notes:
    - Current LOW/HIGH scope; legacy results are not relabelled.

