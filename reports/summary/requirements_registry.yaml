    minimum_closure_action:
      action_type: documentation
      description: >
        Зафиксировать raw как текущий reference и границы обобщения ablation;
        не запускать полный повтор без отдельной гипотезы.
      estimated_scope: small
    new_experiment_required: false
    closure_priority: P2
    blocking_dependencies: []
    completion_criterion: README не представляет diagnostic ablation как финальный выбор.
    notes: []

  - requirement_id: R-PREP-02
    parent_id: R-PREP
    title: Artifact removal, ICA и FASTER
    domain: preprocessing
    requirement_kind: subrequirement
    source:
      type: internal_project_plan
      path: AGENTS.md
      section: Current priorities
      quote: "close remaining preprocessing and feature gaps"
    normalized_requirement: >
      Определить обязательность и, при необходимости, интегрировать
      leakage-safe artifact removal вместо наличия изолированного prototype.
    requirement_type: quality
    priority: requires_clarification
    coverage:
      implementation: partial
      reproducible_config: missing
      experimental_validation: missing
      result_quality: unclear
      documentation: missing
      integration: missing
      demonstration: not_applicable
    overall_status: partial
    evidence:
