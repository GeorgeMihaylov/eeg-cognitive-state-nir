schema_version: 1

project:
  name: eeg-cognitive-state-nir
  requirements_source_status: project_plan_only
  primary_source:
    path: README.md
    type: project_plan
  source_warnings:
    - Официальный файл технического задания не найден в tracked-дереве или Git history.
    - README фиксирует цели проекта, но не задаёт формальную обязательность и приоритет всех deliverables.
    - AGENTS.md и PROJECT_CONTEXT.md используются только как внутренние планы, а не как официальный текст ТЗ.
  missing_authoritative_source:
    description: >
      Для окончательной юридической и приёмочной трассировки требуется добавить
      официальный документ ТЗ или утверждённый план работ с критериями приёмки.
    expected_kind: technical_specification_or_approved_work_plan

requirements:
  - requirement_id: R-DATA
    parent_id: null
    title: Данные и унификация источников
    domain: data
    requirement_kind: parent_requirement
    source:
      type: project_plan
      path: README.md
      section: Назначение проекта / Данные
      quote: "поддержать несколько представлений данных"
    normalized_requirement: >
      Подготовить единый, проверяемый слой данных для собственных EEG-источников
      и отдельно определённых внешних benchmark-треков.
    requirement_type: data
    priority: important
    coverage:
      implementation: complete
      reproducible_config: partial
      experimental_validation: complete
      result_quality: complete
      documentation: partial
      integration: complete
      demonstration: not_applicable
    overall_status: partial
    evidence:
      - type: code
        path: bench/datasets/emotiv_loader.py
        supports: Унифицированную загрузку EEG/POW и целей.
        level: primary
      - type: report
        path: reports/logical_recording_audit.md
        supports: Аудит записей и межисточниковых дубликатов.
        level: primary
    gaps:
      - Нет единого актуального data-card, включающего собственные и внешние треки.
      - Внешние datasets не имеют сопоставимого полного experiment contract.
    minimum_closure_action:
      action_type: documentation
      description: Подготовить единый data-card и явно зафиксировать scope внешних наборов.
      estimated_scope: medium
    new_experiment_required: false
    closure_priority: P1
    blocking_dependencies: [официальный scope данных]
    completion_criterion: >
      Для каждого включённого источника описаны происхождение, задача, splits,
      идентификаторы, ограничения и каноническая точка загрузки.
    notes:
      - Приоритет important выведен из списка основных целей README.

  - requirement_id: R-DATA-01
    parent_id: R-DATA
    title: Унификация gpn_data и Old_EEG
    domain: data
    requirement_kind: subrequirement
    source:
      type: project_plan
      path: README.md
      section: Данные / Исходные источники
      quote: "Проект использует два собственных источника"
    normalized_requirement: >
      Совместно загружать gpn_data и Old_EEG, сохраняя subject, record, source
      и logical-record provenance.
    requirement_type: data
    priority: important
    coverage:
      implementation: complete
      reproducible_config: complete
      experimental_validation: complete
      result_quality: complete
      documentation: complete
      integration: complete
      demonstration: not_applicable
    overall_status: complete
    evidence:
      - type: code
        path: bench/datasets/emotiv_loader.py
        supports: Текущий унифицированный dataset loader.
        level: primary
      - type: code
        path: bench/datasets/logical_recordings.py
        supports: Logical-record identity.
        level: primary
      - type: test
        path: tests/test_cross_source_split.py
        supports: Отсутствие logical-record leakage.
        level: supporting
      - type: report
        path: reports/cross_source_data_audit.md
        supports: Состав и ограничения двух источников.
        level: primary
    gaps: []
    minimum_closure_action:
      action_type: documentation
      description: Поддерживать data provenance при следующих изменениях набора.
      estimated_scope: small
    new_experiment_required: false
    closure_priority: P3
    blocking_dependencies: []
    completion_criterion: Текущий data audit и leakage tests остаются воспроизводимыми.
    notes:
      - Источники не интерпретируются как разные устройства.

  - requirement_id: R-DATA-02
    parent_id: R-DATA
    title: Внешний WESAD benchmark
    domain: data
    requirement_kind: subrequirement
    source:
      type: internal_project_plan
      path: PROJECT_CONTEXT.md
      section: Цель проекта / Возможные треки
      quote: "отдельные задачи на WESAD и других открытых данных"
    normalized_requirement: >
      Поддержать WESAD как отдельный физиологический benchmark, не смешивая
      его задачу с Emotiv Focus/PM.
    requirement_type: integration
    priority: requires_clarification
    coverage:
      implementation: complete
      reproducible_config: missing
      experimental_validation: partial
      result_quality: unclear
      documentation: partial
      integration: partial
      demonstration: missing
    overall_status: partial
    evidence:
      - type: code
        path: bench/datasets/wesad_loader.py
        supports: WESAD dataset adapter.
        level: primary
      - type: code
        path: bench/tasks/wesad_task.py
        supports: Отдельную WESAD task.
        level: primary
      - type: report
        path: reports/integration/wesad_metrics_review.md
        supports: Проверку loader/task на integration branch.
        level: supporting
      - type: commit
        commit: bf0aa97
        supports: Исторические отдельные WESAD experiments вне текущего benchmark contract.
        level: historical
    gaps:
      - Нет текущего канонического WESAD experiment config и записи experiment registry.
      - Исторические WESAD scripts не являются текущим integrated pipeline.
    minimum_closure_action:
      action_type: research_decision
      description: >
        Уточнить, обязателен ли WESAD deliverable; при положительном решении
        интегрировать один ограниченный baseline через текущий runner.
      estimated_scope: medium
    new_experiment_required: false
    closure_priority: P2
    blocking_dependencies: [официальный scope внешних данных]
    completion_criterion: Scope-решение принято; при включении есть config, test и baseline.
    notes:
      - Исторический результат не переносится автоматически.

  - requirement_id: R-DATA-03
    parent_id: R-DATA
    title: STEW и другие открытые EEG-наборы
    domain: data
    requirement_kind: subrequirement
    source:
      type: internal_project_plan
      path: PROJECT_CONTEXT.md
      section: Цель проекта / Возможные треки
      quote: "workload classification на STEW"
    normalized_requirement: >
      Определить, входят ли STEW или другие открытые EEG-наборы в обязательный
      scope платформы.
    requirement_type: data
    priority: requires_clarification
    coverage:
      implementation: missing
      reproducible_config: missing
      experimental_validation: missing
      result_quality: unclear
      documentation: partial
      integration: missing
      demonstration: missing
    overall_status: needs_clarification
    evidence: []
    gaps:
      - Нет loader, task, config или current result для STEW.
      - Не найден официальный признак обязательности.
    minimum_closure_action:
      action_type: scope_clarification
      description: Зафиксировать включение или исключение STEW в утверждённом scope.
      estimated_scope: small
    new_experiment_required: false
    closure_priority: P1
    blocking_dependencies: [официальное ТЗ или утверждённый план]
    completion_criterion: Есть документированное решение scope.
    notes: []

  - requirement_id: R-PREP
    parent_id: null
    title: Предобработка и контроль качества EEG
    domain: preprocessing
    requirement_kind: parent_requirement
    source:
      type: project_plan
      path: README.md
      section: Данные / Обработка источников
      quote: "проверка качества сырых сигналов"
    normalized_requirement: >
      Обеспечить воспроизводимую предобработку, контроль качества и provenance
      преобразований EEG.
    requirement_type: functional
    priority: important
    coverage:
      implementation: complete
      reproducible_config: complete
      experimental_validation: partial
      result_quality: partial
      documentation: complete
      integration: partial
      demonstration: not_applicable
    overall_status: partial
    evidence:
      - type: code
        path: bench/datasets/raw_preprocessing.py
        supports: Registry и semantic hash raw preprocessing.
        level: primary
      - type: experiment
        experiment_id: shallowconvnet_preprocessing_ablation
        supports: Factorial diagnostic фильтрации.
        level: diagnostic
      - type: report
        path: reports/preprocessing_selected_trials_multiseed.md
        supports: Ограниченную multi-seed проверку выбранных вариантов.
        level: primary
    gaps:
      - Не все упоминаемые artifact-removal методы интегрированы в canonical pipeline.
    minimum_closure_action:
      action_type: research_decision
      description: >
        Зафиксировать обязательный минимальный preprocessing scope и отдельно
        решить необходимость artifact removal.
      estimated_scope: small
    new_experiment_required: false
    closure_priority: P1
    blocking_dependencies: [официальный preprocessing scope]
    completion_criterion: Обязательные операции и deferred методы явно разделены.
    notes: []

  - requirement_id: R-PREP-01
    parent_id: R-PREP
    title: Band-pass, notch, CAR и deduplication
    domain: preprocessing
    requirement_kind: subrequirement
    source:
      type: project_plan
      path: README.md
      section: Текущее состояние
      quote: "факторное исследование предварительной обработки сырых ЭЭГ"
    normalized_requirement: >
      Реализовать и проверить конфигурируемые raw, band-pass, notch, CAR и
      logical-record deduplication варианты.
    requirement_type: scientific
    priority: important
    coverage:
      implementation: complete
      reproducible_config: complete
      experimental_validation: partial
      result_quality: partial
      documentation: complete
      integration: complete
      demonstration: not_applicable
    overall_status: partial
    evidence:
      - type: config
        path: experiments/preprocessing_ablation_shallowconvnet.yaml
        supports: Factorial preprocessing matrix.
        level: primary
      - type: test
        path: tests/test_raw_preprocessing_registry.py
        supports: Registry и hash semantics.
        level: supporting
      - type: experiment
        experiment_id: shallowconvnet_preprocessing_ablation
        supports: Seed-42 A-H и выбранные multi-seed trials.
        level: diagnostic
      - type: report
        path: reports/preprocessing_factorial_ablation.md
        supports: Полный seed-42 factorial result.
        level: primary
    gaps:
      - Полный A-H factorial выполнен только для seed 42.
