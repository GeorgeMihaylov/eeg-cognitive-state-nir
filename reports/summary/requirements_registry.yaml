    title: Внешний WESAD benchmark
    domain: data
    requirement_kind: subrequirement
    source:
      type: internal_project_plan
      path: PROJECT_CONTEXT.md
      section: Цель проекта / Возможные треки
      quote: "отдельные задачи на WESAD и других открытых данных"
    normalized_requirement: >
      Поддержать WESAD как отдельный физиологический benchmark, не смешивая
      его задачу с Emotiv Focus/PM.
    requirement_type: integration
    priority: requires_clarification
    coverage:
      implementation: complete
      reproducible_config: missing
      experimental_validation: partial
      result_quality: unclear
      documentation: partial
      integration: partial
      demonstration: missing
    overall_status: partial
    evidence:
