        path: bench/preprocessing/artifacts.py
        supports: Изолированный FASTER-named threshold prototype.
        level: historical
      - type: code
        path: bench/preprocessing/preprocessing_pipeline.py
        supports: Неиспользуемую параллельную preprocessing abstraction.
        level: historical
    gaps:
      - ICA отсутствует.
      - FASTER prototype не является полноценной реализацией алгоритма и не подключён к runner.
      - Нет leakage tests, config provenance или experiment result.
    minimum_closure_action:
      action_type: research_decision
      description: >
        Сначала решить, входит ли artifact removal в обязательный scope;
        не интегрировать prototype без методической спецификации.
      estimated_scope: small
    new_experiment_required: false
    closure_priority: P2
    blocking_dependencies: [artifact-removal acceptance definition]
    completion_criterion: Принято документированное scope-решение и prototype не называется production FASTER.
    notes: []

