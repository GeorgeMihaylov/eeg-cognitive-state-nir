  method: Domain adaptation
  tested: true
  integrated: not_integrated
  decision: defer
  reason: No valid source/target runner contract or justified cross-device domain task.
- experiment_id: mixin_meta_learning_audit
  method: Meta-learning
  tested: true
  integrated: not_integrated
  decision: defer
  reason: No runnable production path or integrated episodic protocol.
- experiment_id: mixin_contrastive_learning_audit
  method: Contrastive learning
  tested: true
  integrated: not_integrated
  decision: defer
  reason: Encoder is not connected downstream and aggregated features are not raw EEG.
