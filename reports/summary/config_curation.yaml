schema_version: 1

protected_defaults: &protected
  safe_to_move: false
  safe_to_edit: false
  protected_fields:
    - config_path
    - output_dir
    - dataset
    - task
    - target
    - targets
    - preprocessing
    - evaluation
    - validation
    - split_seed
    - model_seed
    - model_seeds

families:
  analysis:
    canonical_config: experiments/statistical_analysis.yaml
    canonical_smoke_config: null
    base_configs: []
    legacy_configs: []
    diagnostic_configs:
      - experiments/statistical_analysis.yaml
    protected_configs:
      - experiments/statistical_analysis.yaml
    decision_reason: >
      Общий статистический анализ завершённых запусков является основной
      точкой входа семейства; target-аудиты сохранены отдельными семействами.
    evidence:
      - reports/statistical_model_comparison.md
      - commit:02334e6

  automl:
    canonical_config: experiments/automl_transformer_label_q5.yaml
    canonical_smoke_config: null
    base_configs:
      - configs/groupkfold_torch_transformer_label_q5.yaml
    legacy_configs: []
    diagnostic_configs:
      - experiments/automl_transformer_label_q5.yaml
    protected_configs:
      - experiments/automl_transformer_label_q5.yaml
      - configs/groupkfold_torch_transformer_label_q5.yaml
    decision_reason: >
      Единственный текущий AutoML study использует канонический Transformer
      как отдельно загружаемый base и остаётся диагностическим pilot.
    evidence:
      - reports/automl_transformer_pilot.md
      - bench/automl/study_runner.py

  classification:
    canonical_config: configs/groupkfold_rf_label_q5.yaml
    canonical_smoke_config: configs/smoke_rf_label_q5.yaml
    base_configs: []
    legacy_configs: []
    diagnostic_configs:
      - configs.yaml
    protected_configs:
      - configs/groupkfold_rf_label_q5.yaml
      - configs/groupkfold_torch_mlp_label_q5.yaml
    decision_reason: >
      Random Forest — канонический классический baseline label_q5; Torch MLP
      сохраняется как отдельный neural feature baseline.
    evidence:
      - reports/summary/experiment_registry.yaml
      - reports/integration/canonical_label_q5_smoke.md

  classification_personalization:
    canonical_config: experiments/calibration/label_q5_finetuning_multiseed_20pct.yaml
    canonical_smoke_config: experiments/calibration/label_q5_finetuning_multiseed_cuda_smoke.yaml
    base_configs:
      - experiments/calibration/label_q5_finetuning_base_smoke.yaml
      - experiments/calibration/label_q5_finetuning_cuda_smoke_base.yaml
      - experiments/calibration/label_q5_finetuning_full_base.yaml
      - experiments/calibration/label_q5_finetuning_multiseed_20pct_base.yaml
      - experiments/calibration/label_q5_finetuning_multiseed_cuda_smoke_base.yaml
    legacy_configs:
      - experiments/user_calibration_transformer_label_q5.yaml
    diagnostic_configs: []
    protected_configs:
      - experiments/calibration/label_q5_finetuning_multiseed_20pct.yaml
      - experiments/calibration/label_q5_finetuning_full_subjects.yaml
      - experiments/user_calibration_transformer_label_q5.yaml
    decision_reason: >
      Multiseed 20% MLP fine-tuning является текущим финальным протоколом;
      single-seed и Transformer calibration сохраняются для provenance.
    evidence:
      - reports/summary/experiment_registry.yaml
      - reports/integration/personalization_multiseed_20pct.md

  cross_source:
    canonical_config: experiments/cross_source_generalization.yaml
    canonical_smoke_config: null
    base_configs:
      - configs/groupkfold_source_gpn_rf_transformer_label_q5.yaml
      - configs/groupkfold_source_old_eeg_rf_transformer_label_q5.yaml
    legacy_configs: []
    diagnostic_configs:
      - experiments/cross_source_generalization.yaml
    protected_configs:
      - experiments/cross_source_generalization.yaml
      - configs/groupkfold_source_gpn_rf_transformer_label_q5.yaml
      - configs/groupkfold_source_old_eeg_rf_transformer_label_q5.yaml
    decision_reason: >
      Матрица cross-source и два in-domain reference-конфига образуют один
      специализированный диагностический протокол и не должны смешиваться с
      обычным GroupKFold.
    evidence:
      - reports/cross_source_generalization_report.md
      - bench/experiments/cross_source_generalization.py

  feature_groups:
    canonical_config: experiments/feature_group_rf_ablation.yaml
    canonical_smoke_config: null
    base_configs: []
    legacy_configs: []
    diagnostic_configs:
      - experiments/feature_group_rf_ablation.yaml
      - experiments/feature_group_transformer_ablation.yaml
    protected_configs:
      - experiments/feature_group_rf_ablation.yaml
      - experiments/feature_group_transformer_ablation.yaml
    decision_reason: >
      RF и Transformer ablation имеют разные model families; RF выбран
      семейным entry point, Transformer остаётся отдельным подсемейством.
    evidence:
      - reports/feature_group_rf_ablation.md
      - reports/feature_group_transformer_ablation.md

  ordinal_transformer:
    canonical_config: experiments/ordinal_transformer_multiseed.yaml
    canonical_smoke_config: experiments/ordinal_transformer_smoke.yaml
    base_configs: []
    legacy_configs: []
    diagnostic_configs:
      - experiments/ordinal_transformer_multiseed_statistics.yaml
      - experiments/ordinal_transformer_statistics.yaml
      - experiments/auxiliary_corn_policy_statistics.yaml
    protected_configs:
      - experiments/ordinal_transformer_full_seed42.yaml
      - experiments/ordinal_transformer_multiseed.yaml
      - experiments/auxiliary_corn_lambda_selection_setup.yaml
      - experiments/auxiliary_corn_nested_lambda.yaml
    decision_reason: >
      Multiseed matrix является наиболее полным воспроизводимым ordinal
      протоколом; seed-42, CORN selection и analyses остаются отдельными.
    evidence:
      - reports/ordinal_transformer_multiseed_runs.md
      - reports/ordinal_transformer_multiseed_decision.md

  pm_personalization:
    canonical_config: experiments/calibration/pm_regression_personalization_multiseed_20pct.yaml
    canonical_smoke_config: experiments/calibration/pm_regression_personalization_multiseed_cuda_smoke.yaml
    base_configs:
      - experiments/calibration/pm_regression_personalization_20pct_base.yaml
      - experiments/calibration/pm_regression_personalization_cuda_smoke_base.yaml
    legacy_configs: []
    diagnostic_configs: []
    protected_configs:
      - experiments/calibration/pm_regression_personalization_20pct.yaml
      - experiments/calibration/pm_regression_personalization_multiseed_20pct.yaml
    decision_reason: >
      Multiseed 20% PM personalization является финальным протоколом;
      single-seed run остаётся baseline provenance.
    evidence:
      - reports/summary/experiment_registry.yaml
      - reports/integration/pm_regression_personalization_multiseed_20pct.md

  pm_regression:
    canonical_config: experiments/pm_regression/pm_regression_rf_groupkfold_full.yaml
    canonical_smoke_config: experiments/pm_regression/pm_regression_smoke.yaml
    base_configs: []
    legacy_configs: []
    diagnostic_configs:
      - experiments/pm_regression/pm_regression_robust_scaling_smoke.yaml
    protected_configs:
      - experiments/pm_regression/pm_all_targets_feature_baseline.yaml
      - experiments/pm_regression/pm_regression_rf_groupkfold_full.yaml
      - experiments/pm_regression/pm_regression_smoke.yaml
      - experiments/pm_regression/pm_regression_robust_scaling_smoke.yaml
    decision_reason: >
      Новый канонический full YAML дословно фиксирует семантический протокол
      завершённого пятифолдового mean/RF baseline; существующий smoke остаётся
      отдельной технической точкой входа.
    evidence:
      - reports/summary/experiment_registry.yaml
      - reports/integration/pm_multioutput_regression.md

  preprocessing_ablation:
    canonical_config: experiments/preprocessing_ablation_shallowconvnet.yaml
    canonical_smoke_config: null
    base_configs:
      - configs/raw_preprocessing_a_raw.yaml
      - configs/raw_preprocessing_b_bandpass.yaml
      - configs/raw_preprocessing_c_bandpass_notch.yaml
      - configs/raw_preprocessing_d_bandpass_notch_car.yaml
    legacy_configs: []
    diagnostic_configs:
      - experiments/preprocessing_ablation_shallowconvnet.yaml
    protected_configs:
      - experiments/preprocessing_ablation_shallowconvnet.yaml
      - configs/raw_preprocessing_a_raw.yaml
      - configs/raw_preprocessing_b_bandpass.yaml
      - configs/raw_preprocessing_c_bandpass_notch.yaml
      - configs/raw_preprocessing_d_bandpass_notch_car.yaml
    decision_reason: >
      Factorial matrix является каноническим entry point; четыре raw
      fragments являются компонентами cache/preprocessing, а не запусками.
    evidence:
      - reports/preprocessing_selected_trials_multiseed.md
      - reports/preprocessing_ablation_implementation_audit.md

  raw_eeg:
    canonical_config: configs/groupkfold_torch_shallow_convnet_raw_dedup_label_q5.yaml
    canonical_smoke_config: configs/smoke_torch_shallow_convnet_label_q5.yaml
    base_configs: []
    legacy_configs:
      - configs/groupkfold_torch_eegnet_label_q5.yaml
    diagnostic_configs:
      - configs/groupkfold_torch_eegnet_preprocessed_dedup_label_q5.yaml
      - configs/groupkfold_torch_eegnet_raw_all_label_q5.yaml
    protected_configs:
      - configs/groupkfold_torch_eegnet_raw_dedup_label_q5.yaml
      - configs/groupkfold_torch_shallow_convnet_raw_dedup_label_q5.yaml
      - configs/groupkfold_torch_eegnet_raw_dedup_label_q5_seed7.yaml
      - configs/groupkfold_torch_eegnet_raw_dedup_label_q5_seed123.yaml
      - configs/groupkfold_torch_shallow_convnet_raw_dedup_label_q5_seed7.yaml
      - configs/groupkfold_torch_shallow_convnet_raw_dedup_label_q5_seed123.yaml
    decision_reason: >
      ShallowConvNet raw-deduplicated — финальный CNN entry point; EEGNet
      raw-deduplicated сохраняется отдельным baseline и имеет собственные seed
      configs. Raw-all/filtered варианты остаются diagnostic provenance.
    evidence:
      - reports/summary/experiment_registry.yaml
      - reports/raw_eeg_cnn_model_comparison.md

  sensitivity:
    canonical_config: experiments/label_definition_sensitivity.yaml
    canonical_smoke_config: null
    base_configs: []
    legacy_configs: []
    diagnostic_configs:
      - experiments/label_definition_sensitivity.yaml
    protected_configs:
      - experiments/label_definition_sensitivity.yaml
    decision_reason: >
      Единственный leakage-safe sensitivity analysis для определения label_q5.
    evidence:
      - reports/label_definition_sensitivity.md
      - commit:75d3775

  sequence_models:
    canonical_config: configs/groupkfold_torch_transformer_label_q5.yaml
    canonical_smoke_config: configs/smoke_torch_lstm_label_q5.yaml
    base_configs: []
    legacy_configs:
      - configs/groupkfold_torch_lstm_label_q5.yaml
      - configs/groupkfold_torch_bilstm_label_q5.yaml
      - configs/groupkfold_torch_lstm_gapaware_label_q5.yaml
      - configs/groupkfold_torch_bilstm_gapaware_label_q5.yaml
    diagnostic_configs: []
    protected_configs:
      - configs/groupkfold_torch_transformer_label_q5.yaml
      - configs/groupkfold_torch_lstm_label_q5.yaml
      - configs/groupkfold_torch_bilstm_label_q5.yaml
      - configs/groupkfold_torch_lstm_gapaware_label_q5.yaml
      - configs/groupkfold_torch_bilstm_gapaware_label_q5.yaml
    decision_reason: >
      Transformer length-8 является текущим финальным sequence entry point;
      обычные и gap-aware length-10 LSTM/BiLSTM сохраняются как отдельные
      завершённые historical baselines, причём gap-aware варианты являются
      научно более безопасными reference-конфигами.
    evidence:
      - reports/summary/experiment_registry.yaml
      - reports/transformer_benchmark_report.md

  target_audit:
    canonical_config: experiments/label_target_audit.yaml
    canonical_smoke_config: null
    base_configs: []
    legacy_configs: []
    diagnostic_configs:
      - experiments/label_target_audit.yaml
      - experiments/temporal_target_audit.yaml
    protected_configs:
      - experiments/label_target_audit.yaml
      - experiments/temporal_target_audit.yaml
    decision_reason: >
      Provenance audit является основной точкой входа; temporal audit —
      отдельное дополнение без EEG model training.
    evidence:
      - reports/label_target_audit.md
      - reports/temporal_label_structure.md

  streaming:
    canonical_config: configs/streaming_scientific_v1.yaml
    canonical_smoke_config: configs/streaming.yaml
    base_configs: []
    legacy_configs: []
    diagnostic_configs:
      - configs/streaming_scientific_lightweight_v1.yaml
      - configs/streaming_scientific_v1.yaml
      - configs/streaming.yaml
    protected_configs:
      - configs/streaming_scientific_lightweight_v1.yaml
      - configs/streaming_scientific_v1.yaml
      - configs/streaming.yaml
    decision_reason: >
      Scientific fold-1 held-out replay and the bootstrap-only technical config
      have distinct deployment roles and must not be mixed in result summaries.
    evidence:
      - configs/groupkfold_torch_eegnet_raw_dedup_label_q5.yaml
      - model_zoo/factory.py

  artifact_removal:
    canonical_config: experiments/preprocessing/artifact_removal_ablation_v1.yaml
    canonical_smoke_config: null
    base_configs: []
    legacy_configs: []
    diagnostic_configs: []
    protected_configs:
      - experiments/preprocessing/artifact_removal_ablation_v1.yaml
    decision_reason: >
      Prespecified leakage-safe A/B/C/D artifact-removal comparison on the
      canonical raw cache; only plan-only and a technical smoke are complete.
    evidence:
      - bench/experiments/preprocessing_ablation.py
      - tests/test_preprocessing_ablation.py

  lightgbm_feature_selection:
    canonical_config: experiments/feature_selection/lightgbm_feature_selection_v1.yaml
    canonical_smoke_config: null
    base_configs: []
    legacy_configs: []
    diagnostic_configs: []
    protected_configs:
      - experiments/feature_selection/lightgbm_feature_selection_v1.yaml
    decision_reason: >
      Prespecified LightGBM all-feature versus fold-local top-50 protocol;
      execution is blocked until the optional dependency is installed explicitly.
    evidence:
      - model_zoo/factory.py
      - bench/experiments/pm_all_targets_feature_baseline.py

configs:
  - config_path: configs.yaml
    review_status: reviewed
    decision: keep_as_diagnostic
    decision_reason: Канонический root diagnostic benchmark, не full result.
    canonical_config: configs.yaml
    result_status: diagnostic
    config_role: root
    linked_experiments: []
    evidence: [reports/integration/canonical_label_q5_smoke.md, commit:3549b1b]
    notes: []
    <<: *protected

  - config_path: configs/groupkfold_rf_label_q5.yaml
    review_status: reviewed
    decision: keep
    decision_reason: Канонический classical ML baseline label_q5.
    canonical_config: configs/groupkfold_rf_label_q5.yaml
    result_status: baseline
    canonical_status: completed
    provenance_status: documented
    config_role: full
    linked_experiments: [label_q5_random_forest_groupkfold]
    evidence: [reports/summary/experiment_registry.yaml, commit:50d35ac]
    linked_report: reports/transformer_benchmark_report.md
    linked_runtime: benchmark_results/groupkfold_rf_label_q5
    notes: []
    <<: *protected

  - config_path: configs/groupkfold_torch_mlp_label_q5.yaml
    review_status: reviewed
    decision: keep
    decision_reason: Отдельный feature-based Torch MLP baseline.
    canonical_config: configs/groupkfold_torch_mlp_label_q5.yaml
    result_status: baseline
    config_role: full
    linked_experiments: [label_q5_torch_mlp_groupkfold]
    evidence: [reports/summary/experiment_registry.yaml, commit:50d35ac]
    notes: []
    <<: *protected

  - config_path: configs/smoke_rf_label_q5.yaml
