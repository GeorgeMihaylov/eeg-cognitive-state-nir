normalization_plan:
  - name: Пакет 1. Метаданные
    files:
      - reports/summary/config_curation.yaml
      - reports/summary/config_registry.yaml
      - reports/summary/experiment_registry.yaml
    risk: Низкий, если изменяется только отчётный metadata layer.
    tests:
      - tests/test_config_curation.py
      - tests/test_config_audit.py
    dry_load:
      - src/16_audit_experiment_configs.py --strict
    rollback: Удалить только metadata patch; source experiment YAML не затрагиваются.

  - name: Пакет 2. Base/template consistency
    files:
      - experiments/calibration/
    risk: Средний из-за config_path references и completed-run hashes.
    tests:
      - tests/test_user_finetuning.py
      - tests/test_personalization_multiseed.py
      - tests/test_pm_regression_personalization_multiseed.py
    dry_load:
      - --calibration-experiment ... --plan-only
    rollback: Откатить один loader-family patch и восстановить прежние paths byte-for-byte.

  - name: Пакет 3. Smoke naming and output isolation
    files:
      - configs/smoke_*.yaml
      - experiments/calibration/*smoke*.yaml
    risk: Средний; пути могут использоваться документацией и smoke automation.
    tests:
      - tests/test_bench_runner.py
      - tests/test_config_audit.py
    dry_load:
      - cli.py --config <smoke-config> без execute
    rollback: Вернуть имена и output_dir каждого smoke-конфига отдельно.

  - name: Пакет 4. Registry/report links
    files:
      - reports/summary/experiment_registry.yaml
      - reports/**/*.md
    risk: Низкий для runtime, средний для provenance.
    tests:
      - tests/test_experiment_summary.py
      - tests/test_config_curation.py
    dry_load:
      - src/15_build_experiment_summary.py --strict
      - src/16_audit_experiment_configs.py --strict
    rollback: Откатить только ссылки report/registry; experiment configs не менять.

  - name: Пакет 5. Физическое перемещение
    files: []
    risk: Высокий; в текущем curation safe_to_move=true отсутствует.
    tests:
      - полный pytest
      - поиск всех config_path references
    dry_load:
      - каждый фактический loader type
    rollback: Не выполнять пакет без отдельной migration map и совместимых aliases.
